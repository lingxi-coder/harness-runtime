[package]
name = "mcp"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core = { path = "../core" }
mcp-wire = { workspace = true }
jsonrpc = { path = "../jsonrpc" }
# Local-scope MCP servers live in `~/.claude.json` projects[<cwd-key>].mcpServers;
# the canonical project key is resolved by migrations::global_config.
migrations = { path = "../migrations" }
branding = { path = "../branding" }
telemetry = { path = "../telemetry" }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }
tracing.workspace = true
futures-util = { workspace = true }
base64 = "0.22"
rand = "0.9"
unicode-normalization = "0.1"
sha2 = "0.10"
urlencoding = "2"
url = "2"
regex = "1"
# §20a — the tool-schema meta-validator (`boon::Compiler`/`Schemas`), the
# same JSON-Schema-2020-12 validator already used by
# `orchestrator/src/schema_validation.rs` for tool-input/output validation.
boon = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "io-util", "net", "test-util"] }
serde_json.workspace = true
bytes = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[lints]
workspace = true
