[package]
name = "agent"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core = { path = "../core" }
llm-runtime = { path = "../llm-runtime" }
tool-api = { path = "../tool-api" }
base64 = "0.22"
mcp = { path = "../mcp" }
memory = { path = "../memory" }
hooks = { path = "../hooks" }
permission = { path = "../permission" }
sidequery = { path = "../sidequery" }
# Agent-hooks ORIGIN TRUST (cc 2.1.218 `mvo`): reads the global config's
# `projects[<dir>].hasTrustDialogAccepted` before registering an agent
# definition's frontmatter hooks. Acyclic — `migrations` depends only on
# llm-runtime/telemetry/branding, none of which depend on `agent`.
migrations = { path = "../migrations" }
telemetry = { path = "../telemetry" }
branding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
# cc 2.1.218 agent-name validation: `name.normalize("NFKC").includes(":")` —
# NFKC catches colon look-alikes (U+FF1A/U+FE55) before the plugin-namespace
# reservation check. Same crate/version as `mcp`.
unicode-normalization = "0.1"
boon = "0.6"
thiserror.workspace = true
async-trait.workspace = true
futures = { workspace = true }
tokio = { version = "1", features = ["sync", "fs"] }
tracing.workspace = true

[dev-dependencies]
local-app-plugin = { workspace = true }
test-harness = { path = "../test-harness" }
tempfile = "3"
platform-posix = { path = "../platforms/posix" }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
