[package]
name = "core"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Package name stays `core` (`cargo test -p core`). The rustc crate name
# cannot be `core` — that shadows sysroot libcore and breaks `thiserror`
# (`impl ::core::fmt::Display`) in every dependent.
[lib]
name = "lingxi_core"

[dependencies]
protocol = { path = "../protocol" }
telemetry = { path = "../telemetry" }
branding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# M3-01 settings module: schemas + source-loader pattern reference.
schemars = "0.8"
figment = { version = "0.10", features = ["env", "json", "toml"] }

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
