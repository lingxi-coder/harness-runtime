[package]
name = "core"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Package name stays `core` (`cargo test -p core`). The rustc crate name
# cannot be `core` — that shadows sysroot libcore and breaks `thiserror`
# (`impl ::core::fmt::Display`) in every dependent.
[lib]
name = "lingxi_core"

[dependencies]
async-trait.workspace = true
branding.workspace = true
mobile-linux-api.workspace = true
jsonrpc = { path = "../jsonrpc" }
secrecy = { version = "0.10", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = "1.8"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.1.14"
futures-core.workspace = true
futures-util.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["sync", "io-util", "fs", "process", "rt", "time"] }
tokio-util.workspace = true
fs2 = "0.4"
tempfile = "3.13"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# M3-01 settings module: schemas + source-loader pattern reference.
schemars = "0.8"
figment = { version = "0.10", features = ["env", "json", "toml"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs", "net", "process"] }
libc = "0.2"

[lints]
workspace = true
