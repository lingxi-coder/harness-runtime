[package]
name = "tool-computer-use"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11b: the `computer` tool — screen capture + mouse/keyboard automation.
# Routes to the Arc<dyn ComputerControl> in BuiltinToolContext (a desktop
# automation backend, or a mobile UniFFI impl). Linked by whichever composition
# root wires a ComputerControl handle.

[dependencies]
core = { path = "../../core" }
tool-api = { path = "../../tool-api" }
permission = { path = "../../permission" }
mcp = { path = "../../mcp" }
lingxi-llm-client.workspace = true
# `request_access`'s interactive resolver (mirrors `tool-ui`'s
# `AskUserQuestionResolver`, which depends on `tui-core` the same way).
# Cross-session lock-file home dir resolution (parity with `tool-task`'s
# `lingxi_config_home_dir`).
branding.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
base64 = "0.22"
once_cell = "1"
fs2 = "0.4"
sha2 = "0.10"
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
unicode-segmentation = "=1.12.0"
unicode-normalization = "0.1"
regex = "1"
icu_collator = { path = "../../../third_party/icu_collator", version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_locale = "=2.3.1"
sys-locale = "=0.3.2"
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true

# `kill(pid, 0)` liveness probe for the cross-session lock's staleness check
# (mirrors `apps/cli`'s `daemon_lock` module) — a safe wrapper, so this stays
# compatible with this crate's `#![forbid(unsafe_code)]`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", default-features = false, features = ["signal", "user"] }

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
telemetry = { path = "../../telemetry" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
platform-macos-computer-control = { path = "../../platforms/macos-computer-control" }

[lints]
workspace = true
