[package]
name = "tool-computer-use"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P11b: the `computer` tool — screen capture + mouse/keyboard automation.
# Routes to the Arc<dyn ComputerControl> in BuiltinToolContext (a desktop
# automation backend, or a mobile UniFFI impl). Linked by whichever composition
# root wires a ComputerControl handle.

[dependencies]
tool-api = { path = "../../tool-api" }
platform-api = { path = "../../platform-api" }
permission = { path = "../../permission" }
# `request_access`'s interactive resolver (mirrors `tool-ui`'s
# `AskUserQuestionResolver`, which depends on `tui-core` the same way).
# Cross-session lock-file home dir resolution (parity with `tool-task`'s
# `lingxi_config_home_dir`).
branding.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"
tokio = { workspace = true, features = ["sync"] }

# `kill(pid, 0)` liveness probe for the cross-session lock's staleness check
# (mirrors `apps/cli`'s `daemon_lock` module) — a safe wrapper, so this stays
# compatible with this crate's `#![forbid(unsafe_code)]`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", default-features = false, features = ["signal"] }

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
telemetry = { path = "../../telemetry" }
# Test-only: generates real (tiny, decodable) PNG bytes for the mock
# screenshot backend — `tool_api::util::image_budget::process_image` needs
# an actually-decodable image, not an empty placeholder. Same version
# `tool-api` itself already pins (already resolved in the lockfile).
image = { version = "=0.24.9", default-features = false, features = ["png"] }

[lints]
workspace = true
