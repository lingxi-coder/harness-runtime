[package]
name = "tool-workflow"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The `Workflow` tool: launch a model-authored workflow script as a background
# `LocalWorkflow` task. The byte-exact model-facing surface (name, long-form
# description, input schema) is reproduced from the claude-code v2.1.245 binary;
# the launch goes through the injected `WorkflowLauncher` seam (wired by the
# composition root over the task registry).

[dependencies]
core = { path = "../../core" }
tool-api = { path = "../../tool-api" }
permission = { path = "../../permission" }
branding.workspace = true
workflow = { path = "../../workflow" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
