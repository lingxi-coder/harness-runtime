[package]
name = "tool-git-mobile"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile-only (Android) structured `Git` tool. Backed by libgit2 (the `git2`
# crate) running IN-PROCESS — read + local-write git (no push), HTTPS-token
# auth supplied in-memory by the Kotlin host. Decoupled from minijail (libgit2
# is a library: no exec, no W^X, no sandbox). Registered ONLY when the device +
# config gate passes (computed in android-aar and threaded through MobileConfig
# -> BuiltinToolContext.android_git).

[dependencies]
tool-api = { path = "../../tool-api" }
platform-api = { path = "../../platform-api" }
permission = { path = "../../permission" }
thiserror.workspace = true
# Vendored git2 (T1). The `https` feature is REQUIRED — it enables the mbedTLS
# TLS backend (M-a: swapped from OpenSSL); without it clone/fetch fail. `ssh`
# enables the libssh2 SSH transport built over the same vendored mbedTLS crypto
# backend. `vendored-libgit2` builds the bundled libgit2 C under the NDK (and on
# the host, keeping local ops host-testable); the mbedTLS C is built by the
# vendored `mbedtls-sys` seam pulled in transitively via `https`/`ssh`.
git2 = { path = "../../../third_party/git2-rs/git2", default-features = false, features = [
    "vendored-libgit2",
    "https",
    "ssh",
] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"
telemetry = { path = "../../telemetry" }

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
