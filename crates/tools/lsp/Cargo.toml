[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
core = { path = "../../core" }
jsonrpc = { path = "../../jsonrpc" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
