[package]
name = "tool-skill"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mobile-linux-api.workspace = true
tool-api = { path = "../../tool-api" }
platform-api = { path = "../../platform-api" }
session = { path = "../../session" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
# SKILLEXEC.3: `substitute_arguments_faithful` expands the skill body's
# `$ARGUMENTS` / `$N` / `$name` placeholders. command-api depends only on
# protocol + traits, so this adds no cycle.
command-api = { path = "../../command-api" }
# P2-12 / `zSr`: record model-invoked skills in the process-global
# invoked-skill registry (`compaction::invoked_skills`) so their content can be
# re-injected after a compaction (`rRg`). `compaction` does not depend on
# `tool-skill`, so this adds no cycle; every app that builds `tool-skill`
# already builds `compaction`.
compaction = { path = "../../compaction" }
# SKILLEXEC.6: the embedded `!command` runner mirrors `BashTool::call`'s
# `should_use_sandbox` + `wrap_with_sandbox` decision. `sandbox` is already in
# the lock via `tool-shell`, so this adds only an internal edge (no new external
# package).
sandbox = { path = "../../sandbox" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
once_cell = "1"
thiserror.workspace = true

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
core = { path = "../../core" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
