[package]
name = "tool-agent"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tool-api = { path = "../../tool-api" }
platform-api = { path = "../../platform-api" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
# M8-P6: non-optional — `agent.rs` (the AgentTool impl, always compiled) uses
# `#[async_trait]`. Marking it optional only built under workspace feature
# unification (when some other crate enabled `agent-test-support`); building
# `tool-agent` standalone (e.g. via the engine-desktop composition root) failed.
async-trait = { workspace = true }
serde.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true
once_cell = "1"
thiserror.workspace = true
# `[web-fetch agent] isolation:… ignored` notice (claude 2.1.238 @292890415 `T(...)`).
tracing = { workspace = true }

[features]
# Exposes agent_test_support (M4-05 subagent/mailbox/task/budget mocks) for
# downstream crates' tests (e.g. the tools integration suite). async-trait is
# now a hard dep, so the feature only gates the module.
agent-test-support = []

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
core = { path = "../../core" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
