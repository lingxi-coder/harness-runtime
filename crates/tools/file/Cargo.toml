[package]
name = "tool-file"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core = { path = "../../core" }
branding = { path = "../../branding" }
tool-api = { path = "../../tool-api" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
async-trait.workspace = true
# Line-level Myers diff for the FileEdit/Write `structuredPatch` hunk array
# (1:1 port of jsdiff `structuredPatch`). Pinned to match the tui render crate.
similar = "=2.7.0"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "rt"] }
once_cell = "1"
walkdir = "2.5"
globset = "=0.4.15"
ignore = "=0.4.23"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
grep-matcher = "=0.1.7"
thiserror.workspace = true
# Image decode/resize/re-encode for FileRead image reading (claude-code's image
# path). Optional + gated behind `image-read`; matches codex (no defaults, the
# four codecs only). base64 encodes the processed image for the Anthropic source.
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
base64 = { version = "=0.22.1", optional = true }
# PDF page-count parsing for FileRead PDF routing (claude-code getPDFPageCount).
# Pure-Rust PARSER (NOT a renderer — page-image extraction is P4b). Optional.
# default-features = false drops the nom parser (get_pages would fail to link),
# so defaults stay ON — the parser is exactly what we need. Pinned exact.
lopdf = { version = "=0.34.0", optional = true }
# pdftoppm renders pages into a scratch directory; TempDir gives a unique dir +
# automatic cleanup (RAII). Already in the workspace (dev-dep here + elsewhere),
# so no new external crate enters the lockfile. Optional, gated behind pdf-render.
tempfile = { version = "3", optional = true }

[features]
# FileRead image reading. OFF by default (engine-mobile/minimal stay lean and
# never compile the image codecs); engine-desktop enables it.
image-read = ["dep:image", "dep:base64"]
# FileRead PDF reading. OFF by default; routes PDFs to an inline document block
# (page-count gate via lopdf). engine-desktop enables it alongside image-read.
pdf-read = ["dep:lopdf", "dep:base64"]
# FileRead PDF page-image extraction (claude-code FileRead `pages` path). Spawns
# the `pdftoppm` system binary (poppler-utils) — no new Rust crate, just the
# tokio process/time features + tempfile for the scratch dir. Implies pdf-read
# (routing + page count) and image-read (per-page resize via process_image).
# OFF by default; engine-mobile never compiles it. engine-desktop enables it.
pdf-render = ["pdf-read", "image-read", "dep:tempfile", "tokio/process", "tokio/time"]

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
tempfile = "3"
filetime = "0.2"

[lints]
workspace = true
