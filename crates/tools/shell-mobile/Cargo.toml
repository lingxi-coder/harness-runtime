[package]
name = "tool-shell-mobile"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile-only (Android) `Shell` tool. Runs deny-net commands through the P2
# in-engine Minijail runner via ctx.sandbox.prepare() -> ctx.process.run().
# Registered ONLY when the device + config gate passes (computed in android-aar
# and threaded through MobileConfig -> BuiltinToolContext.android_shell).

[dependencies]
core = { path = "../../core" }
tool-api = { path = "../../tool-api" }
permission = { path = "../../permission" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
once_cell = "1"

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
