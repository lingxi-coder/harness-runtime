[package]
name = "tool-task"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mobile-linux-api.workspace = true
tool-api = { path = "../../tool-api" }
branding.workspace = true
platform-api = { path = "../../platform-api" }
protocol = { path = "../../protocol" }
permission = { path = "../../permission" }
telemetry = { path = "../../telemetry" }
# Monitor's lJr() push-notification splice reuses the shared `Yke()` predicate.
cron = { path = "../../cron" }
sandbox = { path = "../../sandbox" }
task-store = { path = "../../task-store" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
thiserror.workspace = true
rand = "0.9"
once_cell = "1"
core = { path = "../../core" }

[dev-dependencies]
tool-api = { path = "../../tool-api", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
regex = "1"

[lints]
workspace = true
