<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is load-bearing, not cosmetic: the native
         bootstraps measure the device safe area by reading
         `env(safe-area-inset-*)` off a probe element, and under the default
         `viewport-fit=auto` every one of those resolves to 0. Without it
         `deviceContext.safeArea` is always {0,0,0,0} and generated bottom
         navigation clips under the iPhone home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>LingXi Local App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.jsx"></script>
  </body>
</html>
