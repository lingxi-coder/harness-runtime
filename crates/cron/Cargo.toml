[package]
name = "cron"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
branding = { path = "../branding" }
protocol = { path = "../protocol" }
platform-api = { path = "../platform-api" }
tasks = { path = "../tasks" }
# `autonomous_loop` (relocated here to satisfy §8.1 layering) reads feature
# flags via `telemetry::flag_bool`, emits `emit_loop_persistent_activated`, and
# in tests uses `telemetry::{test_set_flag,test_clear_flag}`.
telemetry = { path = "../telemetry" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
futures = "0.3"
# `autonomous_loop` tests (relocated from `tool-cron`) create temp `loop.md`
# fixtures under a scratch dir.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_Time", "Win32_Foundation"] }

# This crate uses platform FFI (libc::kill on Unix, OpenProcess on Windows) for
# PID-liveness checks. The unsafe is isolated to `pid_alive_check`; we override
# the workspace `unsafe_code = "forbid"` lint locally.
[lints]
workspace = true
