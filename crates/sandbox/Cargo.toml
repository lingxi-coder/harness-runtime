[package]
name = "sandbox"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
platform-api = { path = "../platform-api" }
permission = { path = "../permission" }
# Reuse the byte-faithful k0d SBPL profile builder (the macOS sandbox profile
# generator) instead of duplicating a minimal template here. `sandbox-runtime`
# is a leaf crate (no path-dep on sandbox/permission/platform-api/protocol), so this
# introduces no dependency cycle.
sandbox-runtime = { path = "../sandbox-runtime" }
branding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
which = "6"
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
serde_json = { workspace = true }

[lints]
workspace = true
