[package]
name = "command-api"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P9: the slash-command runtime abstraction — registry, dispatcher, parser,
# argument substitution, data model, and the shared builtin scaffolding (99-name
# table + /help/list renderers + unimplemented stub). Mirrors tool-api /
# skill-api. Command handlers live in the optional builtins module (plus platform handlers
# registered directly in the engine-desktop / engine-mobile composition roots).

[dependencies]
core = { path = "../core" }
schemars = { version = "0.8", optional = true }
skill-api = { path = "../skill-api", optional = true }
workflow = { path = "../workflow", optional = true }
cron = { path = "../cron", optional = true }
permission = { path = "../permission", optional = true }
telemetry = { path = "../telemetry", optional = true }
cost = { path = "../cost", optional = true }
indexmap = { version = "2", optional = true }
regex = { version = "1", optional = true }
branding.workspace = true
# #39 UserPromptExpansion: the dispatcher fires the `UserPromptExpansion` hook
# the moment it expands a markdown / MCP-prompt slash command (claude-code
# `WFa`→`b$t`). `hooks` does NOT depend on `command-api` (it pulls protocol /
# telemetry / platform-api / core / permission), so this edge is acyclic.
hooks = { path = "../hooks" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[features]
default = []
builtin-handlers = [
    "dep:schemars",
    "dep:skill-api",
    "dep:workflow",
    "dep:cron",
    "dep:permission",
    "dep:telemetry",
    "dep:cost",
    "dep:indexmap",
    "dep:regex",
]

[dev-dependencies]
orchestrator = { path = "../orchestrator" }
tool-api = { path = "../tool-api" }
llm-runtime = { path = "../llm-runtime" }
compaction = { path = "../compaction" }
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
branding.workspace = true
