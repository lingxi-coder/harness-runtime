[package]
name = "command-api"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P9: the slash-command runtime abstraction — registry, dispatcher, parser,
# argument substitution, data model, and the shared builtin scaffolding (99-name
# table + /help/list renderers + unimplemented stub). Mirrors tool-api /
# skill-api. Command *handlers* live in command-core (plus any platform handlers
# registered directly in the engine-desktop / engine-mobile composition roots).

[dependencies]
branding.workspace = true
protocol = { path = "../protocol" }
platform-api = { path = "../platform-api" }
# #39 UserPromptExpansion: the dispatcher fires the `UserPromptExpansion` hook
# the moment it expands a markdown / MCP-prompt slash command (claude-code
# `WFa`→`b$t`). `hooks` does NOT depend on `command-api` (it pulls protocol /
# telemetry / platform-api / core / permission), so this edge is acyclic.
hooks = { path = "../hooks" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
