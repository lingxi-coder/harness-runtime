[package]
name = "local-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Schema-2 Local App source library, Agent and Chat contracts, and the local-app skill."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
tracing.workspace = true
base64 = "0.22"
jsonschema = { version = "=0.46.10", default-features = false }
fs2 = "0.4"
semver = "1"

[dev-dependencies]
core = { path = "../core" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
