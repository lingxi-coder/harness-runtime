[package]
name = "skill"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Shared skill implementation: Skill data model, registry, frontmatter and
# file loaders, discovery/listing support, MCP-derived builders, and built-in
# skill templates. The model-visible `Skill` tool lives in `tool-skill`.

[dependencies]
core = { path = "../core" }
# Conditional-skill `paths:` matching uses gitignore semantics, the same
# `ignore` crate the `.worktreeinclude` matcher uses.
ignore = "0.4"
tracing = { workspace = true }
telemetry = { path = "../telemetry" }
branding = { path = "../branding" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
# EXPERIMENTAL_SKILL_SEARCH skill-discovery prefetch (register-but-disable,
# default OFF): the one-shot-backed background discovery handle + the async
# candidate-source seam. Mirrors the `memory` crate's prefetch deps.
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
