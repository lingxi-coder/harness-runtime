[package]
name = "tasks"
version = "0.12.0"
edition.workspace = true
license.workspace = true

[dependencies]
mobile-linux-api.workspace = true

branding.workspace = true
mcp = { path = "../mcp" }
core = { path = "../core" }
agent = { path = "../agent" }
hooks = { path = "../hooks" }
workflow = { path = "../workflow" }
permission = { path = "../permission" }
telemetry = { path = "../telemetry" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
rand = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util.workspace = true
task-store = { path = "../task-store" }
tracing.workspace = true

[dev-dependencies]
test-harness = { path = "../test-harness" }
llm-runtime = { path = "../llm-runtime" }
tempfile = "3.13"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
# DEV-only: enables `scope::tests::app_id_grammar_agrees_with_local_apps_ids`,
# a real cross-crate agreement test against `local_apps::ids::is_valid_app_id`
# (the grammar `scope.rs` otherwise mirrors from a copied corpus -- see that
# module's `MIRRORED GRAMMAR` docs). NOT a production dependency: `tasks` has
# five dependents (including `cron`/`coordinator`, which pull none of
# `local-apps`'s bundled SQLite/libgit2 weight today), and
# `check_deps.py` excludes dev-dependencies from its edge check, so this adds
# nothing to their build.
local-apps = { path = "../local-apps" }

[lints]
workspace = true
