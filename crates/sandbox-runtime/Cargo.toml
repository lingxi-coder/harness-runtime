[package]
name = "sandbox-runtime"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The `srt` CLI binary. Off by default so the library (and downstream crates
# such as `engine-mobile`) never pull `clap` into their dependency graph.
cli = ["dep:clap"]

[[bin]]
name = "srt"
required-features = ["cli"]

[dependencies]
branding.workspace = true
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
dirs = "5"
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
ipnet = "2"
percent-encoding = "2.3"
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem", "x509-parser"] }
regex = "1"
rsa = { version = "0.9", features = ["pem"] }
rustls = "0.22"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shlex = "1.3"
time = "0.3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
tokio-rustls = "0.25"
tracing = { workspace = true }
url = "2.5"
webpki-roots = "0.26"
which = "6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
x509-parser = "0.16"

[lints]
workspace = true
