[package]
name = "http-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
platform-api = { path = "../platform-api" }
protocol = { path = "../protocol" }
lingxi-llm-client = { workspace = true, features = ["responses-websocket"] }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# mTLS client-identity + custom CA-trust (CLAUDE_CODE_CLIENT_CERT/_KEY/_KEY_PASSPHRASE/CERT_STORE):
# rustls-native-certs = OS trust store, pkcs8+pem = decrypt an encrypted PKCS#8 client key.
rustls-native-certs = "0.8"
rustls = "0.22"
webpki-roots = "0.26"
pkcs8 = { version = "0.10", features = ["encryption"] }
pem = "3"
eventsource-stream = "0.2"
bytes = { workspace = true }
futures = "0.3"
futures-core = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2"
http = "1"

[dev-dependencies]
lingxi-llm-client = { workspace = true, features = ["realtime-websocket"] }
axum = "0.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# mTLS integration test: rcgen mints a CA + server + client cert, tokio-rustls
# stands up a client-auth-required HTTPS server on loopback, tempfile holds the
# PEM material the transport reads.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
tokio-rustls = "0.25"
tempfile = "3"

[lints]
workspace = true
