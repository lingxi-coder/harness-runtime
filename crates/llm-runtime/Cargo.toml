[package]
name = "llm-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = []
# Independent duplex realtime sessions; Responses WebSockets use the SDK transport.
realtime-websocket = ["lingxi-llm-client/realtime-websocket"]

[dependencies]
core = { path = "../core" }
branding.workspace = true
lingxi-llm-client.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.10", features = ["v4"] }
thiserror.workspace = true
url = "2"
base64 = "0.22"
httpdate = "1"
sha2 = "0.10"
# "process" — `aws_auth::ShellAwsAuthProcess` runs the awsAuthRefresh /
# awsCredentialExport scripts (2.1.198 ZBd/gIn/t2d port).
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "macros", "rt-multi-thread", "process"] }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
telemetry = { path = "../telemetry" }
secret = { path = "../secret" }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
rand = "0.9"
urlencoding = "2"
tracing.workspace = true

[dev-dependencies]
llm-runtime = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
