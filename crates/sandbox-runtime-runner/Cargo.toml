[package]
name = "sandbox-runtime-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sandbox-runtime = { path = "../sandbox-runtime" }
sandbox = { path = "../sandbox" }
tool-api = { path = "../tool-api" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync"] }
# The wrapped command embeds the user command base64-encoded; the HP-6 wrap test
# decodes it to assert on what the shell will actually see. Already in the
# lockfile via `sandbox-runtime`.
base64 = "0.22"

[lints]
workspace = true
