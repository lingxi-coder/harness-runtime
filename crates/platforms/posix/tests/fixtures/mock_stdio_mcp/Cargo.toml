[package]
name = "mock_stdio_mcp"
version = "0.12.0"
edition.workspace = true
publish = false

[[bin]]
name = "mock_stdio_mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "io-std"] }
