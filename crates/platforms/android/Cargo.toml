[package]
name = "platform-android"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile host composition uses portable filesystem and clock primitives,
# native device services, real HTTP, and a separately supplied Linux runtime.
[dependencies]
mobile-linux-api.workspace = true
mobile-linux-core.workspace = true
core = { path = "../../core" }
platform-posix-minimal = { path = "../posix-minimal" }
platform-common = { path = "../common" }
mobile-linux-android.workspace = true
http-client = { path = "../../http-client" }
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"

[lints]
workspace = true
