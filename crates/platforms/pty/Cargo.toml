[package]
name = "platform-pty"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform PTY process lifecycle primitives for LingXi Code"

[dependencies]
anyhow = "1"
portable-pty = "=0.9.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "consoleapi",
    "fileapi",
    "jobapi2",
    "libloaderapi",
    "minwinbase",
    "processenv",
    "processthreadsapi",
    "sddl",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }

[dev-dependencies]
tempfile = "3.13"

[lints]
workspace = true

[lib]
doctest = false
