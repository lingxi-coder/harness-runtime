# The ONLY crate that touches minijail FFI (`platform-android` is
# `forbid(unsafe_code)`). For Android targets the build script compiles the
# vendored upstream libminijail (`third_party/minijail`) with the NDK
# toolchain — see build.rs for why the upstream `minijail`/`minijail-sys`
# crates are NOT used — and lib.rs binds the handful of libminijail.h entry
# points the P0a smoke needs. The P2 runner plan adds the full jailed-spawn
# entry point here.
[package]
name = "platform-android-minijail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
links = "minijail"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
# Static libcap for the NDK (no system libcap on Android): emits
# `cargo:rustc-link-lib=static=cap` + the search path libminijail needs.
platform-android-libcap = { path = "../android-libcap" }

[dependencies]
serde = { workspace = true }
# Pinned to match sibling crates (anthropic-oauth, filestate, llm-runtime, etc.)
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
# `cc` is not in [workspace.dependencies]; declared directly here.
cc = "1"

[lints]
workspace = true
