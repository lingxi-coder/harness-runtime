[package]
name = "platform-common"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Native desktop watcher and child-process LSP transport. POSIX and Windows
# opt in directly; other dependency paths may also enable this feature.
desktop = ["dep:lsp", "dep:notify", "dep:notify-debouncer-mini", "dep:tokio-stream"]

[dependencies]
mobile-linux-api.workspace = true
core = { path = "../../core" }
mobile-linux-core.workspace = true
branding.workspace = true
base64 = "0.22"
jsonrpc = { path = "../../jsonrpc" }
lsp = { path = "../../lsp", optional = true }
llm-runtime = { path = "../../llm-runtime" }
mcp = { path = "../../mcp" }
lingxi-llm-client.workspace = true
http-client = { path = "../../http-client" }
telemetry = { path = "../../telemetry" }
# `.worktreeinclude` gitignore-style pattern matching (copyWorktreeIncludeFiles
# port). Same crate + idiom the orchestrator uses for conditional-rule globs.
ignore = "0.4"
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2"
http = "1"
notify = { version = "8", optional = true }
notify-debouncer-mini = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
sha2 = "0.10"

[dev-dependencies]
axum = "0.7"
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
