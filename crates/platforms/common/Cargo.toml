[package]
name = "platform-common"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mobile-linux-api.workspace = true
core = { path = "../../core" }
mobile-linux-core.workspace = true
branding.workspace = true
jsonrpc = { path = "../../jsonrpc" }
llm-runtime = { path = "../../llm-runtime" }
http-client = { path = "../../http-client" }
telemetry = { path = "../../telemetry" }
# `.worktreeinclude` gitignore-style pattern matching (copyWorktreeIncludeFiles
# port). Same crate + idiom the orchestrator uses for conditional-rule globs.
ignore = "0.4"
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2"
http = "1"
sha2 = "0.10"

[dev-dependencies]
axum = "0.7"
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
