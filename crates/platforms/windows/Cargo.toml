[package]
name = "platform-windows"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mobile-linux-api.workspace = true
core = { path = "../../core" }
branding = { workspace = true }
jsonrpc = { path = "../../jsonrpc" }
# Bridge the transport-owned JSON-RPC connections into `McpRegistry`'s live
# client path, matching the POSIX platform implementation.
mcp = { path = "../../mcp" }
platform-common = { path = "../common", features = ["desktop"] }
http-client = { path = "../../http-client" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures = "0.3"
futures-core = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
fs2 = "0.4"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.13"
axum = { version = "0.7", features = ["ws"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
