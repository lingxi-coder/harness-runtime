[package]
name = "telemetry"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core = { path = "../core" }
telemetry-macros = { path = "../telemetry-macros" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
tracing.workspace = true
opentelemetry = { version = "=0.29.0", default-features = false, features = ["metrics", "logs", "trace"] }
opentelemetry_sdk = { version = "=0.29.0", default-features = false, features = ["metrics", "logs", "trace"] }
opentelemetry-otlp = { version = "=0.29.0", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "http-json", "reqwest-blocking-client", "grpc-tonic", "gzip-tonic", "tls-webpki-roots"] }
opentelemetry-prometheus = "=0.29.0"
opentelemetry-stdout = { version = "=0.29.0", default-features = false, features = ["metrics", "logs", "trace"] }
prometheus = "=0.13.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "tls", "codegen", "prost"] }

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[lints]
workspace = true
