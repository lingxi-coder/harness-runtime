# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-online-type-change
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A column in a table with several hundred million rows must change type, from a 32-bit
      integer to a 64-bit one. The table is read and written continuously. Describe how this is
      done without taking it offline, and what can go wrong at each step.
    settings:
      fusion:
        enabled: true
prompt: |
  A column in a table with several hundred million rows must change type, from a 32-bit
  integer to a 64-bit one. The table is read and written continuously. Describe how this is
  done without taking it offline, and what can go wrong at each step.
