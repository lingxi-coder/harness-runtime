# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-credential-rotation
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      One database credential is used by forty services. It must be rotated. There is no
      maintenance window, the services are deployed independently, and some of them read the
      credential only at process start. Write the plan.
    settings:
      fusion:
        enabled: true
prompt: |
  One database credential is used by forty services. It must be rotated. There is no
  maintenance window, the services are deployed independently, and some of them read the
  credential only at process start. Write the plan.
