# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: patch-deadline-propagation
tags:
  - patch
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A request enters at the API layer with a client deadline, passes through a service layer,
      and reaches a database call. Today only the outermost layer has a timeout, so inner work
      continues after the client has given up. Propose the change.

      ```python
      def handle(req):
          with timeout(seconds=30):
              return service.process(req)

      def process(req):
          rows = db.query(req.filter)
          return summarise(rows)
      ```
    settings:
      fusion:
        enabled: true
