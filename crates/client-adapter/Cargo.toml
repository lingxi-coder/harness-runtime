[package]
name = "client-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# F3-02: lights up the mobile-transport surface — turns `ClientEventListener`
# into a UniFFI callback interface and pulls the `uniffi`-typed DTOs from
# `client-protocol`. Off by default so the bridge-server build (and every
# host-only `cargo test`) never pulls the FFI machinery. Requires the `uniffi`
# package vendored/pinned offline in F3-00.
uniffi = ["dep:uniffi", "client-protocol/uniffi"]

[dependencies]
tool-api = { path = "../tool-api" }
client-presentation = { path = "../client-presentation" }
# The contract crate — the adapter's ONLY output vocabulary. Pure DTOs, no
# engine logic (governing decision §0.2).
client-protocol = { path = "../client-protocol" }
# The shared wire vocabulary (`protocol::ContentBlock` etc.) the lowering fns
# (F1-11) read from.
protocol = { path = "../protocol" }
# `platform_api::OutputStream` / `platform_api::PermissionGate` — the engine sink traits the
# adapter implements (F1-12 / F1-14).
platform-api = { path = "../platform-api" }
# REQUIRED for `permission::tool_default` (the `PromptDefault` → `bool` collapse)
# and the re-exported `PermissionRequest` / `PermissionResponse` from
# `permission::gate` that `AdapterPermissionGate` (F1-14) plumbs through.
permission = { path = "../permission" }
# REQUIRED for `SessionMetadata` (the `SessionMetadata` → `SessionRowDto` lowering,
# F1-11) and its `format_rfc3339_seconds` helper — the parity anchor the
# `SystemTime` → RFC 3339 lowering matches byte-for-byte (plan line 152). Both
# crates are engine-tier, so this edge is legal (decision §0.3).
session = { path = "../session" }
# `SystemTime` → RFC 3339 lowering (F1-11). Same declaration `session` uses so
# the lowered timestamp is byte-identical to `format_rfc3339_seconds`. Already in
# `Cargo.lock` (via `session`), so `--offline` builds stay green.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# REQUIRED for the live-turn wrapper (F1-13): `orchestrator::streaming_loop::PumpedTurn`
# (the assistant-block + stop-reason source synthesized into `MessageComplete`) and
# `orchestrator::OrchestratorError` (the turn `Result` lowered to `ClientEvent::Error`).
# This is a READ-ONLY edge — the wrapper only reads these public types; it makes NO
# engine-behavior change (governing decision §0). Both crates are engine-tier so the
# edge is legal under `scripts/checks/check_deps.py` (no `engine -> engine` rule in FORBIDDEN).
orchestrator = { path = "../orchestrator" }
async-trait.workspace = true
# F3-02: optional UniFFI dep — pulled ONLY under the `uniffi` feature so the
# `#[uniffi::export(callback_interface)]` on `ClientEventListener` compiles for
# the mobile transport. The default (bridge-server / host-test) build never
# pulls it. Pinned/vendored offline in F3-00 (workspace dep: 0.28.3 +
# `tokio` for the async callback interface, F3-07).
uniffi = { workspace = true, optional = true }
# `mpsc` / `oneshot` / `Mutex` / `sync` for the id-keyed permission gate (F1-14)
# and the connection-scoped sink plumbing.
tokio = { workspace = true }
# `CancellationToken` for the live-turn wrapper (F1-13) Cancel path.
tokio-util = { workspace = true }
# `serde_json` is ALLOWED HERE (and ONLY here, NOT in `client-protocol`): this is
# the single crate where `serde_json::Value` is lowered to a JSON String for the
# `input_json` / `result_json` wire fields (governing decision §0.4 / §0.10).
serde_json.workspace = true
# `computer_access_bridge` DTOs (`ComputerAccessExchange` / `ComputerAccessRequest`
# / `ComputerAccessResponse`) the `BridgeComputerAccessBroker` (F2-06-adjacent)
# receives over the channel `engine_desktop::DesktopConfig::computer_access_tx`
# feeds via `tool_computer_use::TuiBridgeResolver` (generic despite the name —
# see that resolver's own doc comment). This is the SAME edge `tool-computer-use`
# already takes on `tui-core` for the identical reason (a per-app-checkbox +
# tier + capability-flags prompt can't ride the generic permission gate); it is
# an `engine -> engine` edge, permitted by `scripts/checks/check_deps.py`.
# (3c) Best-effort `warn!` when persisting an `AllowAlways` choice to
# `settings.local.json` fails — surfaced rather than swallowed (a silent
# persist failure would mislead the user into thinking the rule was saved).
tracing.workspace = true

# NOTE: `client-adapter` must NOT depend on `tui` — `BridgeOutputStream` /
# `TuiPermissionGate` (`tui/src/events/orchestrator_bridge.rs`,
# `tui/src/permission_bridge.rs`) are reference templates to COPY, not import
# (plan F1-10). Adding a `tui` edge here would also be an `engine -> engine`
# coupling the design avoids.

[dev-dependencies]
# The round-trip / sink-capture tests assert wire shape; `client-protocol`'s own
# DTOs are constructed directly so no extra dev dep is needed beyond what the
# test_support module re-exports.
# `uuid` is used ONLY by the F1-11 lowering unit tests to construct a
# `SessionMetadata.uuid` fixture (same version `session` pins).
uuid = { version = "1.10", features = ["v4"] }
# `llm-runtime` is used by the F1-13 turn-wrapper tests after `OrchestratorError::Streaming`
# / `::ApiCall` were retyped from `ApiError` → `LlmError` in Task 5 (commit 5f8b3e35).
# Already in `Cargo.lock` (transitive via `orchestrator`), no new download needed.
llm-runtime = { path = "../llm-runtime" }

[lints]
workspace = true
