[package]
name = "command-core"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M8-P9: the cross-platform builtin slash-command handlers (the 18 "core"
# commands) + the registration entry points the composition roots call. Built
# on the command-api runtime. build.rs captures LINGXI_GIT_SHA_SHORT for /version.

[dependencies]
branding.workspace = true
command-api = { path = "../../command-api" }
# `/update-config` injects the LIVE settings schema into its prompt, exactly as
# the reference does (`Zle(zA(),{io:"input"})` → JSON). Generated from the real
# `SettingsJson` so the skill cannot describe a shape the loader does not accept.
core = { path = "../../core" }
schemars = "0.8"
protocol = { path = "../../protocol" }
skill-api = { path = "../../skill-api" }
workflow = { path = "../../workflow" }
# The bundled `/loop` skill's flag-on (autonomous-default) builder imports the
# autonomous-loop module (binary `Xpc` imports `QVe = io(T3e)`): loop.md detection,
# the preamble, the sentinels, and `logAutonomousLoopActivation`.
cron = { path = "../../cron" }
# WIZARD-06: `/auto-mode-setup` shares the flag grammar + apply pipeline with
# the `lingxi-cli auto-mode-setup` subcommand (`permission::auto_mode_argv`),
# so neither surface can drift from the other's parsing.
permission = { path = "../../permission" }
platform-api = { path = "../../platform-api" }
telemetry = { path = "../../telemetry" }
# `/usage` renders the byte-exact claude-code `i6e()` cost-summary block via
# cost::render::cost_summary; this is non-test code, so `cost` must be a
# regular dependency (it was previously only a dev-dependency below, which
# is unusable from the crate's own lib code).
cost = { path = "../../cost" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
# GAP D (keybindings runtime): insertion-order map for keybinding blocks so the
# default→user merge preserves last-wins order, matching claude-code's
# `Record<key, action>` / `Object.entries` iteration semantics.
indexmap = "2"
# GAP D (keybindings validation): faithful port of the raw-JSON duplicate-key
# scan (`checkDuplicateKeysInJson`) and the `^command:[a-zA-Z0-9:\-_]+$` command
# regex from `validate.ts`. Already in the workspace tree.
regex = "1"
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# Batch-1/2 tests bind handlers to a mock orchestrator handle; compact/cost
# tests construct a bare ToolRegistry + cost/compaction/llm-runtime deps; the
# /init template test checks the OLD_INIT_PROMPT sha256 via sha2.
orchestrator = { path = "../../orchestrator" }
tool-api = { path = "../../tool-api" }
llm-runtime = { path = "../../llm-runtime" }
compaction = { path = "../../compaction" }
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
# The build script assembles env-var names from the branding constants
# instead of spelling the brand out; see build-support/git_metadata.rs.
branding.workspace = true

[lints]
workspace = true
