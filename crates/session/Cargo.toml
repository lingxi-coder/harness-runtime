[package]
name = "session"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Product namespace for the rate-limit checkpoint's user-visible `RESUME.md`
# (`branding::PRODUCT_NAME`, `branding::DOT_DIR`).
branding.workspace = true
core = { path = "../core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
sha2 = "0.10"
async-trait.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt"] }
tracing.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Rollout compression worker / transparent .jsonl.zst reads (codex parity).
zstd = "0.13"
tempfile = "3.13"

[dev-dependencies]
pretty_assertions = "1"
platform-posix = { path = "../platforms/posix" }
filetime = "0.2"
anyhow = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
