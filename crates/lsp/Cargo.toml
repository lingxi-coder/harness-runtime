[package]
name = "lsp"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
branding.workspace = true
core = { path = "../core" }
jsonrpc = { path = "../jsonrpc" }
lsp-types = "0.95"
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing.workspace = true
once_cell = "1"

[dev-dependencies]
tempfile = "3.13"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt-multi-thread", "process", "time", "test-util"] }
test-harness = { path = "../test-harness" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
platform-posix = { path = "../platforms/posix" }

[lints]
workspace = true
