[package]
name = "xcap"
version = "0.9.8"
edition = "2024"
description = "macOS-only source copy of the xcap screen capture library"
license = "Apache-2.0"
repository = "https://github.com/nashaofu/xcap.git"

[workspace]
members = ["."]
resolver = "3"

[features]
image = ["image/default"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
scopeguard = "1.2"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
