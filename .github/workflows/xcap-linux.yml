name: xcap Linux portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install Linux capture and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config dbus \
            libpipewire-0.3-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgbm-dev libdrm-dev
      - name: Check shared locked versions
        run: python3 third_party/xcap/check-lock.py
      - name: Test portal on the default runtime
        run: cargo test --locked --manifest-path third_party/xcap/Cargo.toml --lib portal_tests
      - name: Test portal with the Tokio runtime
        run: cargo test --locked --manifest-path third_party/xcap/Cargo.toml --lib --features portal-tokio portal_tests
