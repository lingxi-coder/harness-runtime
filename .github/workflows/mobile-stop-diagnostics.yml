name: Mobile stop diagnostics
on:
  push:
    branches: [codex/media-stop-cold-ff076]
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"
jobs:
  unit-tests:
    # The AppArmor user-namespace setting below is specific to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install runtime integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libcap2-bin socat
      - name: Enable unprivileged user namespaces on the hosted runner
        shell: bash
        run: |
          # Ubuntu 24.04 restricts capabilities in unprivileged user namespaces
          # through AppArmor. This is a temporary system-wide change, so it is
          # allowed only on GitHub's disposable per-job VM, not a self-hosted runner.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: Verify real bubblewrap filesystem isolation
        shell: bash
        run: |
          # Exercise the distribution's unprivileged binary as the runner user.
          test "$(id -u)" -ne 0
          bwrap_bin="$(command -v bwrap)"
          test "$bwrap_bin" = /usr/bin/bwrap
          test ! -u "$bwrap_bin"
          test ! -g "$bwrap_bin"
          bwrap_capabilities="$(getcap "$bwrap_bin")"
          test -z "$bwrap_capabilities"
          bwrap --version
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc -- /bin/true
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --proc /proc -- /bin/true
          test_name='linux::tests::bwrap_missing_directory_is_empty_readonly_and_user_files_are_preserved'
          cargo test --locked -p sandbox-runtime --all-features --lib "$test_name" -- --ignored --exact | tee "$RUNNER_TEMP/bubblewrap-regression.log"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/bubblewrap-regression.log"
      - name: Test cold pending recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p harness-runtime --features mobile --lib mobile::turn_durability::tests -- --nocapture | tee "$RUNNER_TEMP/cold.log"
          grep -E '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/cold.log"
          grep -F 'stopped_pending_write_failure_is_safe_across_an_independent_process ... ok' "$RUNNER_TEMP/cold.log"
          grep -F 'recovered_pending_requires_confirmation_but_fresh_work_remains_usable ... ok' "$RUNNER_TEMP/cold.log"
      - name: Test mobile queued cancellation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p harness-runtime --features mobile --lib mobile::host::tests::attach_recovery_tests -- --nocapture | tee "$RUNNER_TEMP/stop-mobile.log"
          grep -E '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/stop-mobile.log"
      - name: Test mid-turn and terminal boundaries
        shell: bash
        run: |
          set -euo pipefail
          for target in mid_turn_input_test turn_epilogue_boundary_test streaming_cost_recording_test turn_end_conversation_boundary_test turn_loop_state_boundary_test; do
            cargo test --locked -p orchestrator --test "$target" -- --nocapture | tee "$RUNNER_TEMP/$target.log"
            grep -E '^test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/$target.log"
          done
