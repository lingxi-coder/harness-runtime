name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"

jobs:
  script-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - name: Run every checked-in repository gate
        run: ./scripts/check-all.sh
      - name: Test gate rejection cases
        run: |
          python3 scripts/checks/check_brand_leaks.py --selftest
          python3 scripts/tests/test_dependency_rules.py
          python3 third_party/xcap-macos/test-audit-upstream.py
          python3 packages/webrtc/vendor/test-audit-nix-upstream.py
      - name: Verify every gate and the trigger chain
        run: python3 scripts/tests/test_gate_triggers.py

  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Shared core and minimal client check
        run: |
          cargo check --locked -p core --no-default-features
          cargo check --locked -p client --no-default-features

  # The mobile clients are the only consumers that turn `client`'s
  # `uniffi` feature on, and NOTHING else in this file builds with it: the
  # On 2026-08-27 `ClientCommand` grew past `uniffi_core`'s hardcoded
  # 16384-byte `MetadataBuffer` and stopped compiling for iOS/Android. Be
  # precise about what missed it, because the obvious story is wrong:
  # `unit-tests` runs `cargo test --workspace --all-features`, and
  # `--all-features` turns on `client`'s own `uniffi` feature, so CI
  # WOULD have gone red. What was blind was per-package local verification
  # (`cargo test -p bridge-server`, `-p core`, the electron suites) — none of
  # which enables the feature — so the break survived a whole 21-task run and
  # two rounds of review before any workspace-wide build ran.
  #
  # This job exists for how it fails, not whether. `--all-features` fails as a
  # `const`-eval `assert!` inside a dependency: the whole workspace stops
  # compiling and the message names `uniffi_core/src/metadata.rs`, not the enum
  # that outgrew it. This job names the thing, and its budget test goes red
  # ~4 KiB EARLIER, while the crate still compiles and a test can still run to
  # say WHICH type is running out of room.
  #
  # Its own job, not a step in `compile-check`, so it reports under its own
  # name and cannot hide behind an unrelated earlier failure in that script.
  mobile-ffi-surface:
    name: Mobile FFI surface (client --features uniffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Client feature boundaries
        run: |
          cargo check --locked -p client --no-default-features
          cargo check --locked -p client --no-default-features --features presentation
          cargo check --locked -p client --no-default-features --features adapter
      - name: cargo check (the build iOS and Android actually need)
        run: cargo check --locked -p client --features uniffi
      - name: UniFFI metadata budget
        # Goes red ~4 KiB BEFORE the hard limit, while the crate still compiles
        # and a test can still run to say which type is running out of room.
        run: cargo test --locked -p client --features uniffi --test uniffi_metadata_budget_test

  unit-tests:
    # The AppArmor user-namespace setting below is specific to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install runtime integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libcap2-bin socat
      - name: Enable unprivileged user namespaces on the hosted runner
        shell: bash
        run: |
          # Ubuntu 24.04 restricts capabilities in unprivileged user namespaces
          # through AppArmor. This is a temporary system-wide change, so it is
          # allowed only on GitHub's disposable per-job VM, not a self-hosted runner.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
      - name: Verify real bubblewrap filesystem isolation
        shell: bash
        run: |
          # Exercise the distribution's unprivileged binary as the runner user.
          test "$(id -u)" -ne 0
          bwrap_bin="$(command -v bwrap)"
          test "$bwrap_bin" = /usr/bin/bwrap
          test ! -u "$bwrap_bin"
          test ! -g "$bwrap_bin"
          bwrap_capabilities="$(getcap "$bwrap_bin")"
          test -z "$bwrap_capabilities"
          bwrap --version
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc -- /bin/true
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net --proc /proc -- /bin/true
          test_name='linux::tests::bwrap_missing_directory_is_empty_readonly_and_user_files_are_preserved'
          cargo test --locked -p sandbox-runtime --all-features --lib "$test_name" -- --ignored --exact | tee "$RUNNER_TEMP/bubblewrap-regression.log"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/bubblewrap-regression.log"
      - name: cargo test
        # `--no-fail-fast` is load-bearing, not tidiness. Without it cargo stops
        # at the first failing test BINARY and never runs the rest, so one red
        # test hides every other one and the reported pass count is a truncated
        # prefix. `mid_stream_err_ends_turn_gracefully_as_model_error` broke in
        # d7215d659 (2026-07-13) and stayed invisible for over a month behind an
        # earlier failure for exactly this reason.
        run: cargo test --locked --workspace --all-features --no-fail-fast

  webrtc-source-review:
    # The embedded workspace has its own lock and vet store, independent of
    # the root workspace's source-review result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version '^0.10'
      - name: Check embedded WebRTC source reviews
        working-directory: packages/webrtc
        run: cargo vet check --locked

  webrtc-tests:
    # packages/webrtc is a separate workspace, so root --workspace tests do
    # not run its transport, media, mobile or test-server unit tests.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: packages/webrtc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install native media and relay test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            coturn gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libopus-dev pkg-config
          pkg-config --atleast-version=1.28 gstreamer-1.0
          sudo systemctl stop coturn.service
      - name: Fetch the locked embedded workspace dependencies
        run: cargo fetch --locked
      - name: Test the embedded WebRTC workspace
        # The helper limits GStreamer to the nine required plugins and sets
        # the mobile test's plugin directory before running Cargo offline.
        run: python3 scripts/test-media.py --workspace
      - name: Exercise relay-only transport with local Coturn
        shell: bash
        run: |
          if ss -H -lntu 'sport = :3478' | grep -q .; then
            echo 'TURN test port 3478 is already occupied'
            ss -H -lntup 'sport = :3478'
            exit 1
          fi
          turnserver -n --no-cli --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 \
            --external-ip=127.0.0.1 --listening-port=3478 --min-port=50100 --max-port=50115 \
            --realm=lingxi-local-test --lt-cred-mech --user=lingxi-test:local-turn-test-password \
            --fingerprint --no-tls --no-tcp --no-tcp-relay --no-multicast-peers \
            --allow-loopback-peers --relay-threads=1 --log-file=stdout \
            --pidfile="$RUNNER_TEMP/webrtc-turn.pid" > "$RUNNER_TEMP/webrtc-turn.log" 2>&1 &
          turn_pid=$!
          trap 'status=$?; trap - EXIT; kill "$turn_pid" 2>/dev/null || true; wait "$turn_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/webrtc-turn.log"; fi; exit "$status"' EXIT
          for _ in {1..80}; do
            kill -0 "$turn_pid"
            if test -f "$RUNNER_TEMP/webrtc-turn.pid" &&
               test "$(cat "$RUNNER_TEMP/webrtc-turn.pid")" = "$turn_pid" &&
               ss -H -lunp 'sport = :3478' | grep -F "pid=$turn_pid," | grep -qF '127.0.0.1:3478'; then
              break
            fi
            sleep 0.25
          done
          test "$(cat "$RUNNER_TEMP/webrtc-turn.pid")" = "$turn_pid"
          ss -H -lunp 'sport = :3478' | grep -F "pid=$turn_pid," | grep -qF '127.0.0.1:3478'
          cargo test --locked -p lingxi-webrtc-core --lib \
            transport::tests::forced_turn_exchanges_binary_audio_and_two_video_tracks_without_host_fallback \
            -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/webrtc-turn-media.log"
          grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/webrtc-turn-media.log"
          LINGXI_TURN_TEST_BIND_IP=127.0.0.1 cargo test --locked -p lingxi-webrtc-core --lib \
            transport::tests::turn_close_releases_allocation_before_reusing_source_port \
            -- --ignored --exact --nocapture | tee "$RUNNER_TEMP/webrtc-turn-release.log"
          grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/webrtc-turn-release.log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  core-platforms:
    # Preserve the former cross-compile-desktop package/target coverage using
    # each target's real toolchain: cross has no Apple/MSVC SDK Docker images.
    name: Core platform (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - name: Check shared core and LLM runtime with the native SDK
        run: cargo check --locked --target ${{ matrix.target }} -p core -p llm-runtime

  # Mobile checks of these shared packages run
  # below in harness-ios (Apple SDK) and harness-android (pinned Android NDK),
  # alongside the complete runtime checks, without informational-only skipping.

  cross-compile-musl:
    # v3 §32.4 Layer 5: confirm the engine still type-checks against musl.
    # Hard gate (not continue-on-error) — musl is an inherited M3 target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo check (musl)
        run: |
          # Per spec line 608: musl is a check-only gate (NOT build/test) —
          # confirms the engine type-checks against musl, no runtime needed.
          cargo check --locked --target x86_64-unknown-linux-musl \
                      -p core \
                      -p llm-runtime

  supply-chain:
    # v3 §32.4 Layers 1-3: cargo-deny + cargo-audit + cargo-vet.
    # Hard gate (per the brief: "supply-chain layer"). Per-PR run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      # Use the workspace toolchain for both builds and dependency metadata.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-deny
        # >= 0.19 required so the bundled `rustsec` parser understands the
        # CVSS-4.0 advisory entries now present in the live RUSTSEC DB.
        run: cargo install cargo-deny --locked --version '^0.19'
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version '^0.22'
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version '^0.10'
      - name: cargo deny check
        # Uses lingxi-code/deny.toml for license/advisory/duplicate-version
        # policy. Runs under the workspace toolchain so the metadata
        # pass can parse the edition2024 WASI manifest. The architectural
        # dependency-graph rules (design §8.1) are a separate step below.
        run: cargo deny check
      - name: Check the embedded WebRTC dependency policy
        working-directory: packages/webrtc
        run: cargo deny --locked check --config ../../deny.toml --hide-inclusion-graph
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: Audit the embedded WebRTC workspace
        run: cargo audit --deny warnings --file packages/webrtc/Cargo.lock
      - name: Audit the original nix dependency
        working-directory: packages/webrtc
        run: python3 vendor/audit-nix-upstream.py
      - name: Audit vendored xcap's upstream registry identity
        run: python3 third_party/xcap-macos/audit-upstream.py
      - name: cargo vet
        # Source reviews are required; the checked-in audit store has no exemptions.
        run: cargo vet check --locked

  parity-fixtures:
    # Per the brief: "add parity-fixture gating (every parity_*.rs driver
    # from M3-01..M3-06 in per-PR test matrix)". This job runs ALL parity
    # drivers — both the 7 M2 drivers (inherited from v0.3.0) and the 9
    # M3 drivers (8 from M3-01..M3-06 + the v0.4.0 smoke fixture from
    # Phase D).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: cargo test parity_* drivers
        run: |
          # The 'parity_*' glob picks up every test driver matching the
          # convention. As of v0.4.0:
          # M2 (7): parity_keychain_service_name, parity_lsp_plugin_only,
          #        parity_mcp_initialize, parity_mcp_transports,
          #        parity_sandbox_config, parity_tmux_windows,
          #        parity_worktree_naming.
          # M3 (9): parity_settings_merge, parity_memory_loading,
          #        parity_memory_relevance, parity_messages_create,
          #        parity_betas, parity_oauth_pkce_refresh,
          #        parity_cost_events, parity_tengu_events,
          #        parity_full_v0_4_0_smoke.
          cargo test --locked -p test-harness --test 'parity_*'

  harness-features:
    name: Harness feature (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: ""
          - name: engine
            features: engine
          - name: desktop
            features: desktop
          - name: mobile
            features: mobile
          - name: mobile-uniffi
            features: mobile,uniffi
          - name: android-computer-use
            features: android-computer-use
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Check each feature combination independently
        env:
          HARNESS_FEATURES: ${{ matrix.features }}
        run: |
          feature_args=()
          if [[ -n "$HARNESS_FEATURES" ]]; then
            feature_args=(--features "$HARNESS_FEATURES")
          fi
          cargo check --locked -p harness-runtime --no-default-features "${feature_args[@]}"

  harness-desktop-native:
    name: Harness desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Ensure Windows crypto assembler is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Check desktop runtime against the native platform
        run: cargo check --locked -p harness-runtime --no-default-features --features desktop
      - name: Test Windows volume identity and junction targets
        if: runner.os == 'Windows'
        run: cargo test --locked -p tool-skill --lib native_path_device -- --nocapture
      - name: Test the complete Windows platform library
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'platform-windows-lib-tests.log'
          cargo test --locked -p platform-windows --lib 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A successful Cargo invocation must have run the full library and
          # the native capability/stdio regressions, not an empty test binary.
          $summary = Select-String -Path $log -Quiet -Pattern '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;'
          if (-not $summary) { throw 'Windows platform tests did not complete unfiltered with zero ignored tests' }
          $required = @(
            'process::owned_job::tests::owned_job_native_regressions_in_dedicated_helpers',
            'process::owned_job::tests::outer_job_kills_descendant_after_helper_crash',
            'process::owned_job::tests::payload_does_not_inherit_helper_standard_control_handles',
            'process::supervisor_gate::tests::armed_payload_job_drop_still_terminates_its_child',
            'process::supervisor::integration_tests::real_supervisor_preserves_detached_child_after_normal_foreground',
            'process::supervisor::integration_tests::real_supervisor_strict_cancel_reaps_the_payload_tree',
            'process::background::native_background_stop_tests::supervised_leader_and_group_proofs_follow_actual_job_cleanup',
            'process::background::native_background_stop_tests::supervised_stop_after_leader_exit_verifies_descendant_job',
            'stdio_cancel::tests::full_stdout_and_empty_stdin_are_cancelled_and_joined',
            'stdio_cancel::tests::cancellation_retries_when_the_first_request_precedes_readfile',
            'stdio_cancel::tests::unverified_timeout_is_an_error_and_preserves_the_worker_for_retry'
          )
          foreach ($test in $required) {
            $pattern = '^test ' + [regex]::Escape($test) + ' \.\.\. ok$'
            if (-not (Select-String -Path $log -Quiet -Pattern $pattern)) {
              throw "Required native Windows test did not pass: $test"
            }
          }

  harness-ios:
    name: Harness iOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            sdk: iphoneos
            clang_target: arm64-apple-ios17.0
          - target: aarch64-apple-ios-sim
            sdk: iphonesimulator
            clang_target: arm64-apple-ios17.0-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - name: Check mobile UniFFI runtime with the Apple SDK
        env:
          HARNESS_TARGET: ${{ matrix.target }}
          HARNESS_APPLE_SDK: ${{ matrix.sdk }}
          HARNESS_CLANG_TARGET: ${{ matrix.clang_target }}
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          SDKROOT="$(xcrun --sdk "$HARNESS_APPLE_SDK" --show-sdk-path)"
          export SDKROOT
          export BINDGEN_EXTRA_CLANG_ARGS="--target=$HARNESS_CLANG_TARGET -isysroot $SDKROOT"
          cargo check --locked --target "$HARNESS_TARGET" -p core -p llm-runtime
          cargo check --locked -p harness-runtime --no-default-features --features mobile,uniffi --target "$HARNESS_TARGET"

  harness-android:
    name: Harness Android (${{ matrix.abi }}, ${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        features: ["mobile,uniffi", "android-computer-use,uniffi"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired SDK package "tools".
          packages: platform-tools
      - name: Install pinned Android build tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked --version '=4.1.2'
      - name: Check runtime and target-specific native dependencies
        env:
          HARNESS_ANDROID_ABI: ${{ matrix.abi }}
          HARNESS_FEATURES: ${{ matrix.features }}
        run: |
          cargo ndk -t "$HARNESS_ANDROID_ABI" --platform 29 check --locked -p core -p llm-runtime
          cargo ndk -t "$HARNESS_ANDROID_ABI" --platform 29 check --locked -p harness-runtime --no-default-features --features "$HARNESS_FEATURES"

  linux-seccomp-helper:
    name: Linux seccomp helper (build, discovery, kernel enforcement)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Exercise the real helper in a custom target directory
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/harness-seccomp-target
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/tests/smoke-linux-seccomp.py
