name: Windows process diagnostic (temporary)
on:
  push:
    branches: [codex/windows-process-failures-round8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUST_MIN_STACK: "16777216"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Enable long Git paths on the ephemeral runner
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Instrument the existing cases on the runner
        run: python .github/scripts/windows_process_diagnostic.py
      - name: Run original payload-job close test
        continue-on-error: true
        run: cargo test --locked -p platform-windows --lib process::supervisor_gate::tests::armed_payload_job_drop_still_terminates_its_child -- --exact --nocapture
      - name: Compare close behavior with child stdin held open
        continue-on-error: true
        run: cargo test --locked -p platform-windows --lib process::supervisor_gate::tests::diagnose_job_close_stdin_lifetimes -- --exact --nocapture
      - name: Diagnose each stop mode independently
        shell: pwsh
        run: |
          $name = 'process::background::foreground_stop_tests::native_job_stop_reports_waited_status_before_exit'
          foreach ($testCase in @('false,false', 'true,false', 'false,true', 'true,true')) {
            $env:WINDOWS_PROCESS_DIAG_CASE = $testCase
            Write-Host "DIAG case=$testCase"
            cargo test --locked -p platform-windows --lib $name -- --exact --nocapture
            Write-Host "DIAG case=$testCase exit=$LASTEXITCODE"
          }
