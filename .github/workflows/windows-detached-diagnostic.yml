name: Windows detached supervisor diagnostic
on:
  push:
    branches: [codex/media-windows-production-contract-20261028]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"

jobs:
  detached:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Ensure native crypto assembler
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build the Windows test executable
        run: cargo test --locked -p platform-windows --lib --no-run
      - name: Check the production library
        run: cargo check --locked -p platform-windows --lib
      - name: Verify unsafe handle inheritance reproduces the blocked case
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:LINGXI_DETACHED_JOB_UNSAFE_INHERITANCE = '1'
          $log = Join-Path $env:RUNNER_TEMP 'unsafe-inheritance.log'
          cargo test --locked -p platform-windows --lib process::supervisor::integration_tests::real_supervisor_preserves_detached_child_after_normal_foreground -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          Remove-Item Env:LINGXI_DETACHED_JOB_UNSAFE_INHERITANCE
          $ErrorActionPreference = 'Stop'
          if ($testExit -eq 0) { throw 'negative control unexpectedly passed' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'detached-probe: child alive, stdout inheritable=1')) { throw 'negative control did not establish a live child and inheritable stdout' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'redirected descendant retained the supervisor output pipe')) { throw 'negative control failed for a different reason' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: FAILED. 0 passed; 1 failed; 0 ignored')) { throw 'negative control did not execute exactly the expected test' }
          exit 0
      - name: Verify redirected and deliberately inherited pipes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tests = @(
            'process::supervisor::integration_tests::real_supervisor_preserves_detached_child_after_normal_foreground',
            'process::supervisor::integration_tests::real_supervisor_drains_a_deliberately_inherited_descendant_pipe',
            'process::supervisor_gate::tests::normal_foreground_completion_preserves_detached_descendants',
            'process::supervisor::integration_tests::real_supervisor_retains_output_and_job_until_explicit_stop',
            'process::supervisor::integration_tests::unaccepted_or_stopped_output_handoff_retains_job_and_reports_unknown',
            'process::supervisor::integration_tests::real_registry_stop_does_not_claim_unverified_windows_job_exited',
            'process::owned_job::tests::job_unknown_and_suspended_start_are_proven_in_dedicated_helpers',
            'process::owned_job::tests::owned_job_native_regressions_in_dedicated_helpers',
            'process::background::native_background_stop_tests::stopped_resumed_job_reports_unknown_without_cleanup_receipt',
            'process::background::native_background_stop_tests::strict_foreground_eof_does_not_manufacture_group_cleanup_proof'
          )
          foreach ($test in $tests) {
            $log = Join-Path $env:RUNNER_TEMP (($test -replace '::','-') + '.log')
            cargo test --locked -p platform-windows --lib $test -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw "target test did not pass: $test" }
          }
          exit 0
      - name: Verify old supervisor shutdown defect is detected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:LINGXI_DETACHED_JOB_LEGACY_BLOCKING = '1'
          $log = Join-Path $env:RUNNER_TEMP 'legacy-blocking.log'
          cargo test --locked -p platform-windows --lib process::supervisor::integration_tests::real_supervisor_diagnostic_inherited_writer_blocks_shutdown -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          Remove-Item Env:LINGXI_DETACHED_JOB_LEGACY_BLOCKING
          if ($testExit -ne 0) { exit $testExit }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'detached-probe: result returned; live writer blocks supervisor shutdown')) { throw 'old behavior was not reproduced' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw 'legacy control did not execute' }
          exit 0
      - name: Verify real Windows TaskRegistry legacy negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:LINGXI_REGISTRY_LEGACY_BEST_EFFORT = '1'
          $log = Join-Path $env:RUNNER_TEMP 'registry-real-legacy.log'
          cargo test --locked -p platform-windows --lib process::supervisor::integration_tests::real_registry_stop_does_not_claim_unverified_windows_job_exited -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          Remove-Item Env:LINGXI_REGISTRY_LEGACY_BEST_EFFORT
          if ($testExit -eq 0) { throw 'real registry negative control unexpectedly passed' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'registry-real-probe: stop=Ok(()); status=Killed; held=Some(true)')) { throw 'negative control did not observe Killed while the original process was alive' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: FAILED. 0 passed; 1 failed; 0 ignored')) { throw 'real registry negative control did not execute exactly once' }
          exit 0
      - name: Build TaskRegistry tests
        run: cargo test --locked -p tasks --lib --no-run
      - name: Verify TaskRegistry unknown Stop and legacy negative control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $test = 'registry::registry_test::ordinary_unverified_shell_stop_must_not_publish_killed'
          $negative = Join-Path $env:RUNNER_TEMP 'registry-legacy.log'
          $env:LINGXI_REGISTRY_LEGACY_BEST_EFFORT = '1'
          cargo test --locked -p tasks --lib $test -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $negative
          $negativeExit = $LASTEXITCODE
          Remove-Item Env:LINGXI_REGISTRY_LEGACY_BEST_EFFORT
          if ($negativeExit -eq 0) { throw 'legacy TaskRegistry negative control unexpectedly passed' }
          if (-not (Select-String -Path $negative -Quiet -Pattern 'registry-probe: stop=Ok\(\(\)\); status=Killed')) { throw 'negative control did not reproduce false Killed status' }
          if (-not (Select-String -Path $negative -Quiet -SimpleMatch 'test result: FAILED. 0 passed; 1 failed; 0 ignored')) { throw 'negative control did not run exactly once' }
          $positive = Join-Path $env:RUNNER_TEMP 'registry-unknown.log'
          cargo test --locked -p tasks --lib $test -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $positive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $positive -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw 'TaskRegistry unknown Stop did not pass' }
          exit 0
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-detached-diagnostic
          path: |
            ${{ runner.temp }}/unsafe-inheritance.log
            ${{ runner.temp }}/legacy-blocking.log
            ${{ runner.temp }}/registry-*.log
            ${{ runner.temp }}/process-supervisor*-*.log
          if-no-files-found: ignore

  typed-bash:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Ensure native crypto assembler
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build the real supervisor fixture
        shell: pwsh
        run: |
          cargo build --locked -p platform-windows --features test-support --example typed_bash_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HARNESS_WINDOWS_TYPED_FIXTURE=$env:GITHUB_WORKSPACE\target\debug\examples\typed_bash_fixture.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build the desktop typed Bash tests
        run: cargo test --locked -p harness-runtime --no-default-features --features desktop --lib --no-run
      - name: Verify actual desktop typed Bash entry rejects Windows before spawn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'typed-entry.log'
          cargo test --locked -p harness-runtime --no-default-features --features desktop --lib desktop::typed_bash_windows_tests::desktop_typed_bash_entry_rejects_windows_before_spawn -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw 'typed Bash entry test did not execute exactly once' }
          exit 0
      - name: Real typed Bash Stop with a retained Windows process handle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'typed-stop.log'
          cargo test --locked -p harness-runtime --no-default-features --features desktop --lib desktop::typed_bash_windows_tests::real_typed_bash_stop_preserves_foreground_contract_and_signals_job -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw 'typed Bash Stop did not execute exactly once' }
          exit 0
      - name: Real typed Bash timeout retains output and stops the held descendant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'typed-timeout.log'
          cargo test --locked -p harness-runtime --no-default-features --features desktop --lib desktop::typed_bash_windows_tests::real_typed_bash_timeout_cannot_report_success_with_live_writer -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: ok. 1 passed; 0 failed; 0 ignored')) { throw 'typed Bash timeout did not execute exactly once' }
          exit 0
      - name: Reproduce the old typed Bash timeout defect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'typed-timeout-legacy.log'
          $env:LINGXI_TYPED_LEGACY_FOREGROUND = '1'
          cargo test --locked -p harness-runtime --no-default-features --features desktop --lib desktop::typed_bash_windows_tests::real_typed_bash_timeout_cannot_report_success_with_live_writer -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          Remove-Item Env:LINGXI_TYPED_LEGACY_FOREGROUND
          if ($testExit -eq 0) { throw 'known typed Bash timeout defect did not reproduce; reassess this negative control' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'typed-timeout-probe: result=Ok(Ok(Ok(')) { throw 'typed Bash did not report foreground success in the expected fixture' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'held_before_release=Some(true); signaled_before_release=false; held_after_release=true')) { throw 'negative control did not retain and later signal the real descendant handle' }
          if (-not (Select-String -Path $log -Quiet -SimpleMatch 'test result: FAILED. 0 passed; 1 failed; 0 ignored')) { throw 'negative control did not execute exactly once' }
          exit 0
      - name: Preserve typed Bash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-typed-bash-diagnostic
          path: ${{ runner.temp }}/typed-*.log
          if-no-files-found: ignore
