name: Windows unknown shell owner diagnostic

on:
  push:
    branches: [codex/media-windows-unknown-owner-20261028]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_MIN_STACK: "16777216"

jobs:
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/media-windows-unknown-owner-20261028'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Compile only the diagnostic test crates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-unknown-owner'
          New-Item -ItemType Directory -Force $logs | Out-Null
          cargo test --locked -p core -p tasks -p tool-shell -p platform-windows --lib --no-run 2>&1 |
            Tee-Object -FilePath (Join-Path $logs 'build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run exact user-flow and native-owner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = Join-Path $env:RUNNER_TEMP 'windows-unknown-owner'
          $cases = @(
            @{ Package = 'tool-shell'; Test = 'bash::tests::bash_user_error_exposes_spool_with_real_child_still_running' },
            @{ Package = 'tool-shell'; Test = 'bash::tests::powershell_user_error_exposes_spool_with_real_child_still_running' },
            @{ Package = 'tool-shell'; Test = 'bash::tests::foreground_process_timeout_err_remains_unverified' },
            @{ Package = 'tool-shell'; Test = 'bash::tests::foreground_unverified_arming_preserves_exact_row' },
            @{ Package = 'tool-shell'; Test = 'bash::tests::cancelled_foreground_arming_retains_unknown_row_and_output' },
            @{ Package = 'core'; Test = 'host::shell_supervisor::registration_tests::startup_failure_and_cancellation_keep_real_supervisor_owner' },
            @{ Package = 'core'; Test = 'host::shell_supervisor::registration_tests::startup_owner_retains_real_child_output_and_lease_after_caller_drop' },
            @{ Package = 'core'; Test = 'host::shell_supervisor::registration_tests::start_evidence_is_per_command_and_conflicting_attempts_fail_closed' },
            @{ Package = 'tasks'; Test = 'registry::registry_test::foreground_unverified_observation_uses_exact_row_lease' },
            @{ Package = 'platform-windows'; Test = 'process::supervisor::integration_tests::real_supervisor_strict_cancel_reaps_the_payload_tree' },
            @{ Package = 'platform-windows'; Test = 'process::supervisor::integration_tests::real_supervisor_preserves_detached_child_after_normal_foreground' }
          )
          $failed = 0
          $passed = 0
          for ($i = 0; $i -lt $cases.Count; $i++) {
            $package = $cases[$i].Package
            $test = $cases[$i].Test
            $log = Join-Path $logs ("{0:D2}-{1}.log" -f $i, ($test.Split('::')[-1]))
            cargo test --locked -p $package --lib $test -- --exact --nocapture --test-threads=1 2>&1 |
              Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $text = Get-Content -Raw $log
            $ranOne = $text -match '(?m)^running 1 test\s*$'
            $passedOne = $text -match 'test result: ok\. 1 passed; 0 failed; 0 ignored;'
            if ($code -ne 0 -or -not $ranOne -or -not $passedOne) {
              Write-Host "FAILED: $package $test (exit $code; ran-one=$ranOne; passed-one=$passedOne)"
              $failed++
            } else {
              $passed++
            }
          }
          Write-Host "Exact diagnostics passed: $passed / $($cases.Count); failed: $failed"
          if ($cases.Count -ne 11 -or $passed -ne 11 -or $failed -ne 0) { exit 1 }
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unknown-owner-diagnostic
          path: ${{ runner.temp }}/windows-unknown-owner
          if-no-files-found: ignore
