name: Mod frame receipt diagnostic
on:
  push:
    branches: [codex/media-mod-frame-receipt-20261028-a, codex/media-mod-frame-async-20261028-a]
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "16777216"
jobs:
  worker:
    name: Real Worker and weak session
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Run Node and Bun async Worker contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-vm-modules --test crates/hooks/src/mod_ui_client_worker.test.mjs
          bun test crates/hooks/src/mod_ui_client_worker.test.mjs
      - name: Run async Input through the real Worker and Host
        shell: bash
        run: |
          set -euo pipefail
          export LINGXI_MOD_BUN_EXECUTABLE="$(command -v bun)"
          export LINGXI_ASYNC_TRACE=1
          cargo test --locked -p hooks --lib real_worker_async_input_ -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/async-input.log"
          grep -F 'real_worker_async_input_waits_for_post_before_confirming ... ok' "$RUNNER_TEMP/async-input.log"
          grep -F 'real_worker_async_input_rejection_returns_unknown_and_fences_runtime ... ok' "$RUNNER_TEMP/async-input.log"
          cargo test --locked -p hooks --lib real_worker_background_timer_events_survive_held_action -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/background-events.log"
          grep -F 'real_worker_background_timer_events_survive_held_action ... ok' "$RUNNER_TEMP/background-events.log"
          cargo test --locked -p hooks --lib real_worker_pointer_and_key_wait_for_async_post_delivery -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/listener-events.log"
          grep -F 'real_worker_pointer_and_key_wait_for_async_post_delivery ... ok' "$RUNNER_TEMP/listener-events.log"
          cargo test --locked -p hooks --lib real_worker_held_drop_after_callback_result_fences_before_next_action -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/held-drop.log"
          grep -F 'real_worker_held_drop_after_callback_result_fences_before_next_action ... ok' "$RUNNER_TEMP/held-drop.log"
          cargo test --locked -p hooks --lib real_worker_held_drop_after_finalize_ack_revokes_worker_environment -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/finalize-ack-drop.log"
          grep -F 'real_worker_held_drop_after_finalize_ack_revokes_worker_environment ... ok' "$RUNNER_TEMP/finalize-ack-drop.log"
          cargo test --locked -p hooks --lib real_worker_finalize_failure_returns_unknown_and_revokes_environment -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/finalize-failure.log"
          grep -F 'real_worker_finalize_failure_returns_unknown_and_revokes_environment ... ok' "$RUNNER_TEMP/finalize-failure.log"
      - name: Run held Worker and sink admission tests
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          export LINGXI_MOD_BUN_EXECUTABLE="$(command -v bun)"
          cargo test --locked -p hooks --lib real_worker_callback_with_ -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/worker-receipt.log"
          grep -F 'real_worker_callback_with_default_sink_has_unknown_outcome ... ok' "$RUNNER_TEMP/worker-receipt.log"
          grep -F 'real_worker_callback_with_accepting_sink_returns_updated_frame ... ok' "$RUNNER_TEMP/worker-receipt.log"
          cargo test --locked -p hooks --lib real_worker_accepted_callback_render_fault_returns_unknown -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/render-fault.log"
          grep -F 'real_worker_accepted_callback_render_fault_returns_unknown ... ok' "$RUNNER_TEMP/render-fault.log"
          cargo test --locked -p hooks --lib weak_session_frame_admission_reports_dead_owner_and_sink_result -- --nocapture | tee "$RUNNER_TEMP/weak-receipt.log"
          grep -F 'weak_session_frame_admission_reports_dead_owner_and_sink_result ... ok' "$RUNNER_TEMP/weak-receipt.log"
      - name: Run runHeld v3 host lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export LINGXI_MOD_BUN_EXECUTABLE="$(command -v bun)"
          cargo test --locked -p hooks --lib prepared_tsx_client_runs_the_host_render_mount_draw_post_and_unload_lifecycle -- --nocapture --test-threads=1 | tee "$RUNNER_TEMP/lifecycle.log"
          grep -F 'prepared_tsx_client_runs_the_host_render_mount_draw_post_and_unload_lifecycle ... ok' "$RUNNER_TEMP/lifecycle.log"
  adapter:
    name: Client sink and generation guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Check client adapter and UniFFI together
        run: cargo check --locked -p client --features adapter,uniffi
      - name: Test admission on default and mobile listener sinks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p client --features adapter,uniffi --lib default_sink_cannot_claim_client_frame_admission -- --nocapture | tee "$RUNNER_TEMP/default-sink.log"
          grep -F 'default_sink_cannot_claim_client_frame_admission ... ok' "$RUNNER_TEMP/default-sink.log"
          cargo test --locked -p client --features adapter,uniffi --lib listener_sink_propagates_native_frame_admission -- --nocapture | tee "$RUNNER_TEMP/listener.log"
          grep -F 'listener_sink_propagates_native_frame_admission ... ok' "$RUNNER_TEMP/listener.log"
          cargo test --locked -p client --features adapter,uniffi --lib emit_mod_ui_client_frame_forwards_runtime_and_frame_json -- --nocapture | tee "$RUNNER_TEMP/forward.log"
          grep -F 'emit_mod_ui_client_frame_forwards_runtime_and_frame_json ... ok' "$RUNNER_TEMP/forward.log"
      - name: Test unknown outcome across ClientEvent serialization
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p client --features adapter,uniffi --lib mod_ui_unknown_outcome_survives_correlated_event_serialization -- --nocapture | tee "$RUNNER_TEMP/unknown-outcome.log"
          grep -F 'mod_ui_unknown_outcome_survives_correlated_event_serialization ... ok' "$RUNNER_TEMP/unknown-outcome.log"
      - name: Test generation guard admission and cancellation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orchestrator --lib client_frame_receipt_tests -- --nocapture | tee "$RUNNER_TEMP/guard.log"
          grep -F 'guard_and_sink_outcomes_are_preserved ... ok' "$RUNNER_TEMP/guard.log"
          grep -F 'cancellation_during_publication_does_not_claim_unexecuted_side_effects ... ok' "$RUNNER_TEMP/guard.log"
  mobile:
    name: Mobile runtime and listener compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/llm-client
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Compile mobile runtime, UniFFI, and test listeners
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p harness-runtime --no-default-features --features mobile,uniffi --lib
          cargo check --locked -p harness-runtime --no-default-features --features mobile,uniffi --tests
