# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-log-compaction
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      An append-only log is read by consumers that persist a byte offset as their durable
      resume pointer. The log has grown past what the disk can hold. Explain the designs
      available for reclaiming space, and what each one does to those durable offsets.
    settings:
      fusion:
        enabled: true
prompt: |
  An append-only log is read by consumers that persist a byte offset as their durable
  resume pointer. The log has grown past what the disk can hold. Explain the designs
  available for reclaiming space, and what each one does to those durable offsets.
