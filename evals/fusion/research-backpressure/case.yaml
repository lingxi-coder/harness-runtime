# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-backpressure
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A processing pipeline has a producer that is faster than its consumer. Data must not be
      dropped and memory must stay bounded. Explain the mechanisms available and what each one
      does to the producer.
    settings:
      fusion:
        enabled: true
prompt: |
  A processing pipeline has a producer that is faster than its consumer. Data must not be
  dropped and memory must stay bounded. Explain the mechanisms available and what each one
  does to the producer.
