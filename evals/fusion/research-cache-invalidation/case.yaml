# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-cache-invalidation
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A read-through cache sits in front of a relational store. Some writers bypass the cache
      and write to the store directly, and those writers cannot be changed. Explain the ways a
      system can keep the cache from serving stale rows in that situation, and say which you
      would choose for a workload of 90% reads, rows updated a few times a day, and a hard
      requirement that a read never returns data more than 30 seconds stale.
    settings:
      fusion:
        enabled: true
prompt: |
  A read-through cache sits in front of a relational store. Some writers bypass the cache
  and write to the store directly, and those writers cannot be changed. Explain the ways a
  system can keep the cache from serving stale rows in that situation, and say which you
  would choose for a workload of 90% reads, rows updated a few times a day, and a hard
  requirement that a read never returns data more than 30 seconds stale.
