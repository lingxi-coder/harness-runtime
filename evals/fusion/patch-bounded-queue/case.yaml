# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: patch-bounded-queue
tags:
  - patch
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      This queue is unbounded and the process runs out of memory under load. Propose the change,
      including what should happen when the bound is reached.

      ```rust
      pub struct Ingest { queue: Mutex<VecDeque<Event>> }

      impl Ingest {
          pub fn push(&self, event: Event) {
              self.queue.lock().unwrap().push_back(event);
          }
          pub fn pop(&self) -> Option<Event> {
              self.queue.lock().unwrap().pop_front()
          }
      }
      ```
    settings:
      fusion:
        enabled: true
