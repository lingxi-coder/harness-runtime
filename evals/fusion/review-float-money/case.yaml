# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: review-float-money
tags:
  - review
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Review this code and report what is wrong with it.

      ```python
      def split_bill(total_dollars, people):
          share = total_dollars / people
          return [round(share, 2) for _ in range(people)]
      ```
    settings:
      fusion:
        enabled: true
prompt: |
  Review this code and report what is wrong with it.

  ```python
  def split_bill(total_dollars, people):
      share = total_dollars / people
      return [round(share, 2) for _ in range(people)]
  ```
