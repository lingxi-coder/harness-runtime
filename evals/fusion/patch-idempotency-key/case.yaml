# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: patch-idempotency-key
tags:
  - patch
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      This handler creates an order. Callers retry on network failure, and duplicate orders are
      being created. Propose the change that fixes it, precisely enough that someone could
      implement it from your answer.

      ```python
      @app.post("/orders")
      def create_order(req):
          order = Order(customer=req.customer, items=req.items)
          db.insert(order)
          return {"id": order.id}
      ```
    settings:
      fusion:
        enabled: true
prompt: |
