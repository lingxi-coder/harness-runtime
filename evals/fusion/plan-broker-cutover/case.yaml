# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-broker-cutover
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A service consumes from broker A with at-least-once delivery and must move to broker B.
      Consumers are idempotent. There is no maintenance window and no acceptable message loss.
      Write the cutover plan, including how you would know at each point whether to continue or
      roll back.
    settings:
      fusion:
        enabled: true
prompt: |
  A service consumes from broker A with at-least-once delivery and must move to broker B.
  Consumers are idempotent. There is no maintenance window and no acceptable message loss.
  Write the cutover plan, including how you would know at each point whether to continue or
  roll back.
