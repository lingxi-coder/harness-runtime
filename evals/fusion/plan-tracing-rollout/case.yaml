# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-tracing-rollout
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Add distributed tracing to a system of thirty services that currently emit only logs and
      metrics. Adoption must be incremental and must not require every team to change code at
      once. Write the plan.
    settings:
      fusion:
        enabled: true
prompt: |
  Add distributed tracing to a system of thirty services that currently emit only logs and
  metrics. Adoption must be incremental and must not require every team to change code at
  once. Write the plan.
