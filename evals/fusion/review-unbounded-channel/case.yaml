# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: review-unbounded-channel
tags:
  - review
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Review this code and report what is wrong with it.

      ```rust
      let (tx, mut rx) = tokio::sync::mpsc::unbounded_channel();
      tokio::spawn(async move {
          while let Some(event) = source.next().await {
              let _ = tx.send(event);
          }
      });
      tokio::spawn(async move {
          while let Some(event) = rx.recv().await {
              store.write(event).await;
          }
      });
      ```
    settings:
      fusion:
        enabled: true
prompt: |
  Review this code and report what is wrong with it.

  ```rust
  let (tx, mut rx) = tokio::sync::mpsc::unbounded_channel();
  tokio::spawn(async move {
      while let Some(event) = source.next().await {
          let _ = tx.send(event);
      }
  });
  tokio::spawn(async move {
      while let Some(event) = rx.recv().await {
          store.write(event).await;
      }
  });
  ```
