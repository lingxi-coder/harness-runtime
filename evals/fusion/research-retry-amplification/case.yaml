# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-retry-amplification
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A request passes through four services, and each layer retries on failure. Explain how
      those retries combine during a partial outage, and what bounds the resulting load.
    settings:
      fusion:
        enabled: true
prompt: |
  A request passes through four services, and each layer retries on failure. Explain how
  those retries combine during a partial outage, and what bounds the resulting load.
