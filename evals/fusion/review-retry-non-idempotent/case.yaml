# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: review-retry-non-idempotent
tags:
  - review
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Review this code and report what is wrong with it.

      ```python
      def charge_customer(client, customer_id, cents):
          for attempt in range(5):
              try:
                  return client.post("/charges", json={"customer": customer_id, "amount": cents})
              except TimeoutError:
                  time.sleep(2 ** attempt)
          raise RuntimeError("charge failed")
      ```
    settings:
      fusion:
        enabled: true
prompt: |
  Review this code and report what is wrong with it.

  ```python
  def charge_customer(client, customer_id, cents):
      for attempt in range(5):
          try:
              return client.post("/charges", json={"customer": customer_id, "amount": cents})
          except TimeoutError:
              time.sleep(2 ** attempt)
      raise RuntimeError("charge failed")
  ```
