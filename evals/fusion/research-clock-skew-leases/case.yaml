# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: research-clock-skew-leases
tags:
  - research
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      A group of nodes coordinates exclusive access to a resource using leases with an
      expiry timestamp. Explain how such a scheme fails when node clocks disagree, and what
      existing designs do about it.
    settings:
      fusion:
        enabled: true
prompt: |
  A group of nodes coordinates exclusive access to a resource using leases with an
  expiry timestamp. Explain how such a scheme fails when node clocks disagree, and what
  existing designs do about it.
