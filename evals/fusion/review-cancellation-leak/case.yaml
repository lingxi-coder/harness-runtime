# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: review-cancellation-leak
tags:
  - review
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Review this code and report what is wrong with it.

      ```rust
      impl Worker {
          fn start(&mut self) {
              let state = self.state.clone();
              tokio::spawn(async move {
                  loop {
                      state.tick().await;
                      tokio::time::sleep(Duration::from_secs(1)).await;
                  }
              });
          }

          fn stop(&mut self) {
              self.running = false;
          }
      }
      ```
    settings:
      fusion:
        enabled: true
prompt: |
