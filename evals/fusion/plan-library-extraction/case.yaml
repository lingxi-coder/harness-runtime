# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-library-extraction
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      One library must be extracted from a monorepo into its own repository. Its history should
      survive, its consumers inside the monorepo must keep building throughout, and CI must not
      go red. Write the plan.
    settings:
      fusion:
        enabled: true
prompt: |
  One library must be extracted from a monorepo into its own repository. Its history should
  survive, its consumers inside the monorepo must keep building throughout, and CI must not
  go red. Write the plan.
