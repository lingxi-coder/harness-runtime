# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: patch-pagination
tags:
  - patch
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      This endpoint returns every row and has become slow. Propose the change, including how a
      client walks the whole collection while rows are being inserted and deleted.

      ```python
      @app.get("/events")
      def list_events():
          return [e.to_dict() for e in db.query(Event).order_by(Event.created_at).all()]
      ```
    settings:
      fusion:
        enabled: true
prompt: |
