# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-blob-migration
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Twelve terabytes of immutable blobs must move between two object stores. Readers must
      keep working throughout, every object must be verified after transfer, and there must be
      a point from which the whole thing can be abandoned safely. Write the plan.
    settings:
      fusion:
        enabled: true
prompt: |
  Twelve terabytes of immutable blobs must move between two object stores. Readers must
  keep working throughout, every object must be verified after transfer, and there must be
  a point from which the whole thing can be abandoned safely. Write the plan.
