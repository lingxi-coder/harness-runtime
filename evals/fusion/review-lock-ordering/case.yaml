# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: review-lock-ordering
tags:
  - review
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Review this code and report what is wrong with it.

      ```rust
      struct Account { balance: Mutex<i64> }

      fn transfer(from: &Account, to: &Account, amount: i64) {
          let mut a = from.balance.lock().unwrap();
          let mut b = to.balance.lock().unwrap();
          *a -= amount;
          *b += amount;
      }

      fn settle(pair: &(Account, Account)) {
          let mut second = pair.1.balance.lock().unwrap();
          let mut first = pair.0.balance.lock().unwrap();
          let net = *first - *second;
          *first -= net / 2;
          *second += net / 2;
      }
      ```
    settings:
      fusion:
        enabled: true
prompt: |
  Review this code and report what is wrong with it.

  ```rust
  struct Account { balance: Mutex<i64> }

  fn transfer(from: &Account, to: &Account, amount: i64) {
      let mut a = from.balance.lock().unwrap();
      let mut b = to.balance.lock().unwrap();
      *a -= amount;
      *b += amount;
  }

  fn settle(pair: &(Account, Account)) {
      let mut second = pair.1.balance.lock().unwrap();
      let mut first = pair.0.balance.lock().unwrap();
      let net = *first - *second;
      *first -= net / 2;
      *second += net / 2;
  }
  ```
