# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: plan-flag-retirement
tags:
  - plan
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      Two hundred feature flags have accumulated. Most are fully rolled out, some are dead, and
      a few still gate incomplete work. Write the plan for retiring them.
    settings:
      fusion:
        enabled: true
prompt: |
  Two hundred feature flags have accumulated. Most are fully rolled out, some are dead, and
  a few still gate incomplete work. Write the plan for retiring them.
