# One task, asked two ways. Everything else is shared so the two runs are
# paired and their difference is attributable to the arm, not to the setup.
name: patch-graceful-shutdown
tags:
  - patch
runs: 2
max_turns: 6
arms:
  - label: single
  - label: fusion
    prompt: |
      /fusion --models anthropic:claude-opus-5,openai:gpt-5.4,google:gemini-3-pro
      This pool never finishes shutting down when a worker is stuck. Propose the change, so that
      shutdown always completes and the caller can tell whether it completed cleanly.

      ```rust
      pub async fn shutdown(&self) {
          for handle in self.workers.lock().await.drain(..) {
              let _ = handle.await;
          }
      }
      ```
    settings:
      fusion:
        enabled: true
prompt: |
  This pool never finishes shutting down when a worker is stuck. Propose the change, so that
  shutdown always completes and the caller can tell whether it completed cleanly.

  ```rust
  pub async fn shutdown(&self) {
      for handle in self.workers.lock().await.drain(..) {
          let _ = handle.await;
      }
  }
  ```
