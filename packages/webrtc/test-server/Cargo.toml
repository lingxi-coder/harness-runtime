[package]
name = "lingxi-webrtc-test-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
lingxi-webrtc-core = { path = "../core" }
rtc = "=0.21.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[dev-dependencies]
webrtc = "=0.21.1"
futures = "0.3"
bytes = "1"
serde_json = "1"
