services:
  webrtc:
    build: .
    environment:
      LINGXI_TEST_TOKEN: ${LINGXI_TEST_TOKEN:?set a local test token of at least 16 bytes}
      LINGXI_TURN_URL: ${LINGXI_TURN_URL:-}
      LINGXI_TURN_USERNAME: ${LINGXI_TURN_USERNAME:-}
      LINGXI_TURN_CREDENTIAL: ${LINGXI_TURN_CREDENTIAL:-}
      LINGXI_ADVERTISED_IP: ${LINGXI_ADVERTISED_IP:-127.0.0.1}
    ports:
      - "${LINGXI_SIGNALING_BIND_IP:-127.0.0.1}:18080:8080"
      - "50000-50015:50000-50015/udp"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
