# Host-only relay fixture, separate from phone/LAN signaling. No public service.
services:
  turn:
    image: coturn/coturn:4.18.0-r0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    command:
      - -n
      - -v
      - --pidfile=/tmp/turnserver.pid
      - --log-file=stdout
      - --listening-port=3478
      - --external-ip=${LINGXI_TURN_ADVERTISED_IP:-127.0.0.1}
      - --min-port=50100
      - --max-port=50115
      - --realm=lingxi-local-test
      - --lt-cred-mech
      - --user=lingxi-test:local-turn-test-password
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      # Necessary only for two peers on the same local relay test host.
      - --allow-loopback-peers
    ports:
      - "${LINGXI_TURN_BIND_IP:-127.0.0.1}:3478:3478/udp"
      - "${LINGXI_TURN_BIND_IP:-127.0.0.1}:3478:3478/tcp"
      - "${LINGXI_TURN_BIND_IP:-127.0.0.1}:50100-50115:50100-50115/udp"
    read_only: true
    tmpfs: [/var/lib/coturn, /tmp, /var/run]
    cap_drop: [ALL]
    # Official binary carries this file capability; removing it prevents exec.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
